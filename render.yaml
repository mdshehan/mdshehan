services:
  - type: web
    name: fb-reels-downloader
    runtime: python
    plan: free
    region: oregon
    branch: claude/fb-reels-downloader-0vOi4
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60"
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: WEB_CONCURRENCY
        value: 2
